name: Build firmware

on:
  push:
    paths:
    - 'fw/**'
    - '.github/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      build_type:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Update githash.h and build firmware
        run: |
          BUILD_TYPE="${{ inputs.build_type }}"
          BT="CIBuild"
          if [ "$BUILD_TYPE" = "B" ]; then
            BT="Beta"
          fi
          if [ "$BUILD_TYPE" = "R" ]; then
            BT="Release"
          fi

          # Version from AIRDOS04
          PREVMAJOR=$(grep MAJOR fw/AIRDOS04/nextversion | cut -d ' ' -f 2)
          PREVMINOR=$(grep MINOR fw/AIRDOS04/nextversion | cut -d ' ' -f 2)
          NEXTRELEASE=$(grep RELEASE fw/AIRDOS04/nextversion | cut -d ' ' -f 2)
          NEXTBUILD=$(grep BUILD fw/AIRDOS04/nextversion | cut -d ' ' -f 2)
          CURMAJOR=$(grep '^#define MAJOR' fw/AIRDOS04/AIRDOS04.ino | head -n 1 | awk '{print $3}')
          CURMINOR=$(grep '^#define MINOR' fw/AIRDOS04/AIRDOS04.ino | head -n 1 | awk '{print $3}')

          if [ "$CURMAJOR" != "$PREVMAJOR" ] || [ "$CURMINOR" != "$PREVMINOR" ]; then
            NEXTRELEASE=0
          fi

          echo "// This file is overwritten by github actions, do not update it manually" > fw/AIRDOS04/githash.h
          echo "String githash = \"${{ github.sha }},${BT}\";" >> fw/AIRDOS04/githash.h
          echo "#define GHRELEASE ${NEXTRELEASE}" >> fw/AIRDOS04/githash.h
          echo "#define GHBUILD ${NEXTBUILD}" >> fw/AIRDOS04/githash.h
          echo "#define GHBUILDTYPE ${BT}" >> fw/AIRDOS04/githash.h
          cp fw/AIRDOS04/githash.h fw/AIRDOS04X/githash.h

          # Build AIRDOS04
          cd fw/AIRDOS04
          pio run
          cd ../..

          # Build AIRDOS04X
          cd fw/AIRDOS04X
          pio run
          cd ../..

          # Prepare fw/build with named hex files
          rm -rf fw/build
          mkdir -p fw/build
          cp fw/AIRDOS04/.pio/build/airdos04/firmware.hex "fw/build/fw_AIRDOS04_AIRDOS04.latest-${BT}.hex"
          cp fw/AIRDOS04X/.pio/build/airdos04x/firmware.hex "fw/build/fw_AIRDOS04X_AIRDOS04X.latest-${BT}.hex"

          # Update nextversion
          NEXTBUILD=$(echo "${NEXTBUILD}+1" | bc)
          if [ "$BUILD_TYPE" = "R" ]; then
            NEXTRELEASE=$(echo "${NEXTRELEASE}+1" | bc)
          fi
          echo "#this file is maintained by github actions" > fw/AIRDOS04/nextversion
          echo "MAJOR ${CURMAJOR}" >> fw/AIRDOS04/nextversion
          echo "MINOR ${CURMINOR}" >> fw/AIRDOS04/nextversion
          echo "RELEASE ${NEXTRELEASE}" >> fw/AIRDOS04/nextversion
          echo "BUILD ${NEXTBUILD}" >> fw/AIRDOS04/nextversion
          cp fw/AIRDOS04/nextversion fw/AIRDOS04X/nextversion

          # Restore githash to User for local builds
          echo "// This file is overwritten by github actions, do not update it manually" > fw/AIRDOS04/githash.h
          echo "String githash = \"${{ github.sha }},User\";" >> fw/AIRDOS04/githash.h
          echo "#define GHRELEASE ${NEXTRELEASE}" >> fw/AIRDOS04/githash.h
          echo "#define GHBUILD 0" >> fw/AIRDOS04/githash.h
          echo "#define GHBUILDTYPE User" >> fw/AIRDOS04/githash.h
          cp fw/AIRDOS04/githash.h fw/AIRDOS04X/githash.h

          touch root

      - name: Store data
        uses: actions/upload-artifact@v4
        with:
          name: fw_build
          path: |
            fw/build/*.hex
            fw/AIRDOS04/nextversion
            fw/AIRDOS04/githash.h
            fw/AIRDOS04X/nextversion
            fw/AIRDOS04X/githash.h
            root
          retention-days: 1

  commit:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      # PAT: Classic PAT with "repo" scope, or Fine-grained with Contents read+write. Must have access to this repo and to private submodules (e.g. doc/assets).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT || github.token }}

      - run: |
          rm -rf fw/build fw/artifacts
          mkdir -p fw/build fw/artifacts

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fw_build
          path: fw/artifacts/fw_build

      - name: Apply build results
        run: |
          cp -R fw/artifacts/fw_build/* ./
          rm -rf fw/artifacts root
          git status

      - name: Get last commit message
        id: last-commit-message
        run: |
          echo "msg=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Generate file pattern
        id: file-pattern
        run: |
          PATTERN="fw/build/*"
          for dir in fw/AIRDOS04 fw/AIRDOS04X; do
            [ -f "$dir/githash.h" ] && PATTERN="$PATTERN $dir/githash.h $dir/nextversion"
          done
          echo "pattern=$PATTERN" >> $GITHUB_OUTPUT
          echo "Generated pattern: $PATTERN"

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: ${{ steps.last-commit-message.outputs.msg }}, extended build
          file_pattern: ${{ steps.file-pattern.outputs.pattern }}
